# GCG 攻击配置：Llama-3.2-3B-Instruct
# 与 experiments/configs/individual_llama3.2.py 权威参数一致
model:
  path: Llama-3.2-3B-Instruct
  conversation_template: llama-3

tokenizer:
  path: Llama-3.2-3B-Instruct
  kwargs:
    use_fast: true

data:
  train: data/advbench/harmful_behaviors.csv
  n_train: 10
  offset: 0

attack:
  name: gcg
  n_steps: 500
  test_steps: 50
  batch_size: 32
  lr: 0.01
  topk: 256
  temp: 1
  filter_cand: true
  control_init: "! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! ! !"

output:
  result_prefix: results/llama-3.2
